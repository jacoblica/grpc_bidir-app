syntax = "proto3";

package bidir;

enum Opcode {
  UNKNOWN = 0;
  PING = 1;
  DATA = 2;
  STATUS = 3;
  CLOSE = 4;
}

message Request {
  Opcode opcode = 1;
  int32 id = 2;
  string payload = 3;
  bool active = 4;
  float value = 5;
}

message Response {
  Opcode opcode = 1;
  int32 id = 2;
  string message = 3;
  bool success = 4;
  float result = 5;
}

service BidirService {
  // The client listens and the server dials, so the roles are reversed from the
  // usual gRPC convention: the dialing side (server) sends Request messages and
  // receives Response messages, while the listening side (client) does the
  // opposite. Hence the request type of this rpc is the stream the client sends.
  rpc Stream(stream Response) returns (stream Request);
}
